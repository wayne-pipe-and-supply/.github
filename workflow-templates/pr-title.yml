name: pr-title

# Checks that the PR title is a Conventional Commit line. We squash-merge,
# so the PR title becomes the commit message on main.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Description must not start with an uppercase letter ("fix: Trim" fails).
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description "{subject}" in PR title "{title}" must start with a
            lowercase letter, e.g. "fix: trim route value before comparing".
